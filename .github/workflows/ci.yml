name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  # The full suite is expensive, so it does not run per push on a branch. These
  # two triggers are how it is reached anyway: nightly, and on demand before a
  # merge that deserves it (issue 24).
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # Sub-second and needs no browser, so it belongs on every push rather than
      # only in the main-branch all-tests job.
      - name: Run unit tests
        run: npm run test:unit

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 7

  mobile-tests:
    name: Mobile Responsive Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run mobile responsive tests
        run: npm run test:mobile

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures
          path: test-results/
          retention-days: 7

  # Every Playwright project, not just the mobile one.
  #
  # DECISION (issue 24, 2026-09-02): this stays off per-push branch builds. It
  # is ~20 minutes of browser time and the mobile job above already guards the
  # surface that actually breaks. The gap it leaves -- a PR looking green and
  # failing on merge -- is closed by the nightly schedule and by
  # workflow_dispatch, which is the trade the issue proposed. Revisit if a
  # merge ever breaks something the nightly then catches hours later.
  all-tests:
    name: All Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-build
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run all tests
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-tests-report
          path: playwright-report/
          retention-days: 30
